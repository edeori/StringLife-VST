name: Release StringLife

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the live MinIO installers after both builds succeed
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/vst-release.yml
    with:
      product-id: stringlife
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    secrets: inherit
