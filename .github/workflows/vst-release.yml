name: Reusable VST release

on:
  workflow_call:
    inputs:
      product-id:
        required: true
        type: string
      publish:
        description: Publish installers to the live MinIO destinations
        type: boolean
        default: false
    secrets:
      REGISTRY_TOKEN:
        required: true
      APPLE_CERTIFICATES_P12:
        required: true
      APPLE_CERTIFICATES_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true
      MINIO_ACCESS_KEY:
        required: true
      MINIO_SECRET_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: vst-release-${{ github.repository }}-${{ inputs.product-id }}
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-24.04
    outputs:
      mac-key: ${{ steps.config.outputs.mac_key }}
      windows-key: ${{ steps.config.outputs.windows_key }}
      bucket: ${{ steps.config.outputs.bucket }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: config
        env:
          PRODUCT_ID: ${{ inputs.product-id }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: python3 ci/registry.py

  build:
    needs: registry
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Prepare Apple signing
        if: runner.os == 'macOS'
        env:
          CERTIFICATES: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ci/apple-signing.sh
      - name: Build signed and notarized macOS installer
        if: runner.os == 'macOS'
        env:
          NOTARY_PROFILE: ci-notary
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ vars.INSTALLER_IDENTITY }}
        run: bash ci/package-mac.sh
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12"

  publish:
    if: inputs.publish
    needs: [registry, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Upload installers to stable MinIO keys
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          BUCKET: ${{ needs.registry.outputs.bucket }}
          MAC_KEY: ${{ needs.registry.outputs.mac-key }}
          WINDOWS_KEY: ${{ needs.registry.outputs.windows-key }}
        run: |
          set -euo pipefail
          test -s dist/installer.pkg
          test -s dist/installer.exe
          aws configure set default.s3.addressing_style path
          endpoint=https://download.mothproduction.hu
          aws --endpoint-url "$endpoint" s3 cp dist/installer.pkg "s3://$BUCKET/$MAC_KEY" --cache-control 'no-cache' --only-show-errors
          aws --endpoint-url "$endpoint" s3 cp dist/installer.exe "s3://$BUCKET/$WINDOWS_KEY" --cache-control 'no-cache' --only-show-errors
          printf 'Published both installers from commit `%s`.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
