services:
  postgres:
    image: postgres:17
    container_name: licensing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licensing}
      POSTGRES_USER: ${POSTGRES_USER:-licensing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licensing} -d ${POSTGRES_DB:-licensing}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  licensing-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stringlife-licensing-api
    ports:
      - "${LICENSING_API_BIND_ADDRESS:-0.0.0.0}:${LICENSING_API_EXTERNAL_PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      LICENSING_SERVER_HOST: 0.0.0.0
      LICENSING_SERVER_PORT: 8787
      LICENSING_EXPOSE_PUBLIC_API: "true"
      LICENSING_EXPOSE_ADMIN_UI: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
    restart: unless-stopped

  licensing-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stringlife-licensing-admin
    ports:
      - "${LICENSING_ADMIN_BIND_ADDRESS:-127.0.0.1}:${LICENSING_ADMIN_EXTERNAL_PORT:-8788}:8788"
    env_file:
      - .env
    environment:
      LICENSING_SERVER_HOST: 0.0.0.0
      LICENSING_SERVER_PORT: 8788
      LICENSING_EXPOSE_PUBLIC_API: "false"
      LICENSING_EXPOSE_ADMIN_UI: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
    restart: unless-stopped
