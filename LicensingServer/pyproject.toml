[project]
name = "stringlife-licensing-server"
version = "0.1.0"
description = "Minimal licensing server scaffold for the reusable JUCE licensing module"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["licensing_server"]
