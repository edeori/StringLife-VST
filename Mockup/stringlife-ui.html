<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StringLife — unified UI mockup</title>
  <link rel="stylesheet" href="../../MothProduction-Shared-VST/UI/Mockup/moth-ui.css">
  <style>
    .stringlife { --plugin-width: 820px; --plugin-ratio: 1.31; --moth-background:url("../../../StringLife-VST/Mockup/Assets/stringlife-background.png"); --accent:#80d7be; --accent-hot:#b5ffe9; --accent-rgb:128,215,190; }
    .life-layout { height:100%; display:grid; grid-template-rows:68px 1fr 120px; gap:10px; }
    .life-title { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 12px; }
    .life-title .moth-product { text-align:left; }
    .life-title h1 { font-size:33px; }
    .instrument { justify-self:center; }
    .monitor { justify-self:end; display:grid; justify-items:end; gap:5px; }
    .main-row { min-height:0; display:grid; grid-template-columns:1fr 164px; gap:10px; }
    .age-panel { padding:18px 24px; display:grid; grid-template-rows:auto 1fr 82px; }
    .age-head { display:flex; justify-content:space-between; align-items:center; }
    .strings { position:relative; display:grid; place-items:center; overflow:hidden; }
    .strings::before,.strings::after { content:""; position:absolute; left:8%; right:8%; height:1px; background:linear-gradient(90deg,transparent,var(--accent),transparent); box-shadow:0 0 9px rgba(128,215,190,.55); }
    .strings::before { top:39%; transform:rotate(-3deg); }
    .strings::after { top:58%; transform:rotate(2deg); }
    .string-art { width:74%; height:70%; opacity:.8; }
    .string-line { fill:none; stroke:rgba(181,255,233,.72); stroke-width:1.2; filter:drop-shadow(0 0 4px rgba(128,215,190,.5)); }
    .age-readout { text-align:center; z-index:1; }
    .age-readout output { display:block; color:var(--accent-hot); font:34px "Rajdhani"; }
    .age-control { display:grid; align-content:center; gap:7px; }
    .age-labels { display:flex; justify-content:space-between; color:#8d95a0; font-size:11px; letter-spacing:.18em; text-transform:uppercase; }
    .side-panel { padding:16px 14px; display:grid; grid-template-rows:auto 1fr 100px; justify-items:center; }
    .meters { display:flex; align-items:end; gap:18px; padding:8px 0 4px; }
    .meter-wrap { display:grid; justify-items:center; gap:5px; }
    .vertical-meter { position:relative; width:19px; height:82px; overflow:hidden; border:1px solid #2c333b; border-radius:8px; background:#040609; box-shadow:inset 0 2px 7px #000; }
    .vertical-meter span { position:absolute; inset:auto 3px 3px; height:var(--level); border-radius:5px; background:linear-gradient(0deg,var(--accent),#d6e447 75%,#ff565b); box-shadow:0 0 8px rgba(128,215,190,.36); }
    .mix-control { display:grid; justify-items:center; gap:4px; }
    .mix-control .moth-knob { width:52px; }
    .advanced-row { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
    .macro { padding:9px 10px; display:grid; justify-items:center; align-content:center; gap:1px; }
    .macro .moth-knob { width:60px; }
    .macro .moth-field { height:21px; min-width:53px; font-size:13px; }
  </style>
</head>
<body class="moth-preview">
  <main class="moth-plugin stringlife">
    <header class="moth-header">
      <div class="moth-maker">Moth Production</div>
      <img class="moth-logo" src="../../MothProduction-Shared-VST/UI/Logo/moth_logo.png" alt="Moth Production">
      <div class="moth-header-actions"><span class="moth-version">v1.6.2</span><button class="moth-button" data-toggle aria-pressed="false">A / B</button><button class="moth-button moth-bypass" data-toggle data-bypass aria-pressed="false">Bypass</button></div>
    </header>
    <section class="moth-content"><div class="life-layout">
      <div class="life-title"><div class="moth-product"><h1>StringLife</h1><div class="moth-tagline">Restore tired strings</div></div><div class="moth-tabs instrument" data-tabs><button class="moth-tab is-active" aria-selected="true">Guitar</button><button class="moth-tab" aria-selected="false">Bass</button></div><div class="monitor"><span class="moth-kicker">Monitor</span><div class="moth-tabs" data-tabs><button class="moth-tab is-active" aria-selected="true">Normal</button><button class="moth-tab" aria-selected="false">Delta</button></div></div></div>
      <div class="main-row">
        <section class="moth-panel moth-panel is-accented age-panel">
          <div class="age-head"><h2 class="moth-section-title">String age</h2><span class="moth-kicker">Macro control</span></div>
          <div class="strings"><svg class="string-art" viewBox="0 0 500 210"><path class="string-line" d="M15 40C92 28 107 79 173 52s108-39 157 8 81 71 155 34M15 74c63-19 113 40 166 8s94-11 137 20 104 22 167-2M15 112c79 19 104-29 166-9s88 48 148 8 92-15 156 13M15 148c58-24 106 12 161 16s106-44 161-7 84 25 148 7M15 180c76 8 121-35 178-4s87 15 135-2 94 12 157 2"/></svg><div class="age-readout"><span class="moth-control-label">Revival</span><output id="ageValue">64%</output></div></div>
          <div class="age-control"><input class="moth-range" type="range" min="0" max="100" value="64" step="1" data-readout="ageValue" data-unit="%" data-default="50" aria-label="String age"><div class="age-labels"><span>Dead</span><span>Balanced</span><span>Fresh</span></div></div>
        </section>
        <aside class="moth-panel side-panel"><h2 class="moth-section-title">Input / output</h2><div class="meters"><div class="meter-wrap"><div class="vertical-meter"><span style="--level:64%"></span></div><span class="moth-kicker">In</span></div><div class="meter-wrap"><div class="vertical-meter"><span style="--level:76%"></span></div><span class="moth-kicker">Out</span></div></div><div class="mix-control"><span class="moth-control-label">Mix</span><div class="moth-knob"><img class="moth-knob-face" src="../../MothProduction-Shared-VST/UI/Components/Knobs/SplitFire-knob.png" alt=""><input type="range" min="0" max="100" value="100" step="1" data-readout="mixLife" data-unit="%" data-default="100" aria-label="Wet dry mix"></div><output id="mixLife" class="moth-field">100%</output></div></aside>
      </div>
      <div class="advanced-row">
        <section class="moth-panel macro"><span class="moth-control-label">Spark</span><div class="moth-knob"><img class="moth-knob-face" src="../../MothProduction-Shared-VST/UI/Components/Knobs/SplitFire-knob.png" alt=""><input type="range" min="0" max="100" value="68" data-readout="spark" data-unit="%" data-default="50"></div><output id="spark" class="moth-field">68%</output></section>
        <section class="moth-panel macro"><span class="moth-control-label">Bite</span><div class="moth-knob"><img class="moth-knob-face" src="../../MothProduction-Shared-VST/UI/Components/Knobs/SplitFire-knob.png" alt=""><input type="range" min="0" max="100" value="57" data-readout="bite" data-unit="%" data-default="50"></div><output id="bite" class="moth-field">57%</output></section>
        <section class="moth-panel macro"><span class="moth-control-label">Shimmer</span><div class="moth-knob"><img class="moth-knob-face" src="../../MothProduction-Shared-VST/UI/Components/Knobs/SplitFire-knob.png" alt=""><input type="range" min="0" max="100" value="44" data-readout="shimmer" data-unit="%" data-default="50"></div><output id="shimmer" class="moth-field">44%</output></section>
        <section class="moth-panel macro"><span class="moth-control-label">Bloom</span><div class="moth-knob"><img class="moth-knob-face" src="../../MothProduction-Shared-VST/UI/Components/Knobs/SplitFire-knob.png" alt=""><input type="range" min="0" max="100" value="61" data-readout="bloom" data-unit="%" data-default="50"></div><output id="bloom" class="moth-field">61%</output></section>
      </div>
    </div></section>
    <div class="moth-footer-vents"></div>
  </main>
  <script src="../../MothProduction-Shared-VST/UI/Mockup/moth-ui.js"></script>
</body>
</html>
